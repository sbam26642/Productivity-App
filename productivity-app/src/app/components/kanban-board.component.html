<section class="space-y-4">
  <div class="flex items-center justify-between">
    <div>
      <p class="text-xs uppercase tracking-[0.24em] text-ink-500">Kanban</p>
      <h2 class="font-display text-2xl">Flow board</h2>
    </div>
    <button
      class="rounded-full border border-ink-200 bg-white px-4 py-2 text-sm font-medium text-ink-700 transition hover:border-ink-300 hover:text-ink-900"
      (click)="seedDemo()"
    >
      Load demo
    </button>
  </div>

  <div cdkDropListGroup class="grid gap-4 lg:grid-cols-4">
    <div
      *ngFor="let column of columns()"
      class="glass rounded-2xl border border-black/5 p-4"
    >
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-semibold text-ink-800">{{ column.title }}</h3>
        <span class="text-xs text-ink-400">{{ column.taskIds.length }}</span>
      </div>

      <div
        cdkDropList
        [id]="column.id"
        class="mt-4 space-y-3"
        (cdkDropListDropped)="drop($event, column)"
      >
        <div
          *ngFor="let task of taskFor(column)"
          cdkDrag
          [cdkDragData]="task.id"
          class="rounded-xl border border-black/10 bg-white px-3 py-3 shadow-edge"
        >
          <div class="flex items-start justify-between gap-2">
            <p class="text-sm font-medium text-ink-800">{{ task.title }}</p>
            <button
              class="text-xs text-ink-400 hover:text-ink-600"
              (click)="deleteTask(task.id)"
            >
              Remove
            </button>
          </div>
          <div class="mt-2 flex flex-wrap gap-2">
            <span
              *ngFor="let label of task.labels"
              class="rounded-full bg-ink-100 px-2 py-1 text-[0.65rem] font-semibold uppercase tracking-wide text-ink-600"
            >
              {{ label }}
            </span>
          </div>
        </div>
      </div>

      <form class="mt-4 flex gap-2" (ngSubmit)="addTask(column.id)">
        <input
          class="w-full rounded-full border border-ink-200 bg-white px-3 py-2 text-sm focus:border-ink-400 focus:outline-none"
          placeholder="Add a task..."
          [(ngModel)]="newTaskTitle[column.id]"
          name="task-{{ column.id }}"
        />
        <button
          class="rounded-full bg-ink-900 px-3 py-2 text-xs font-semibold text-white"
          type="submit"
        >
          Add
        </button>
      </form>
    </div>
  </div>
</section>
