<section class="space-y-4">
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <p class="text-xs uppercase tracking-[0.24em] text-ink-500">Calendar</p>
      <h2 class="font-display text-2xl">Studio schedule</h2>
    </div>
    <div class="flex items-center gap-2">
      <button
        class="rounded-full border border-ink-200 bg-white px-3 py-2 text-xs font-semibold text-ink-700"
        (click)="setToday()"
      >
        Today
      </button>
      <button
        class="rounded-full border border-ink-200 bg-white px-3 py-2 text-xs font-semibold text-ink-700"
        (click)="previousMonth()"
      >
        Prev
      </button>
      <button
        class="rounded-full border border-ink-200 bg-white px-3 py-2 text-xs font-semibold text-ink-700"
        (click)="nextMonth()"
      >
        Next
      </button>
    </div>
  </div>

  <div class="glass flex flex-wrap items-center gap-3 rounded-2xl p-4">
    <input
      class="flex-1 rounded-full border border-ink-200 bg-white px-3 py-2 text-sm focus:border-ink-400 focus:outline-none"
      placeholder="New event"
      [(ngModel)]="newTitle"
      name="event-title"
    />
    <input
      class="rounded-full border border-ink-200 bg-white px-3 py-2 text-sm focus:border-ink-400 focus:outline-none"
      type="date"
      [(ngModel)]="newDate"
      name="event-date"
    />
    <input
      class="rounded-full border border-ink-200 bg-white px-3 py-2 text-sm focus:border-ink-400 focus:outline-none"
      type="time"
      [(ngModel)]="newTime"
      name="event-time"
    />
    <button class="rounded-full bg-ink-900 px-4 py-2 text-xs font-semibold text-white" (click)="addEvent()">
      Add
    </button>
  </div>

  <div class="grid grid-cols-7 gap-2 text-xs text-ink-400">
    <span>Mon</span>
    <span>Tue</span>
    <span>Wed</span>
    <span>Thu</span>
    <span>Fri</span>
    <span>Sat</span>
    <span>Sun</span>
  </div>

  <div cdkDropListGroup class="grid grid-cols-7 gap-2">
    <div
      *ngFor="let day of days()"
      cdkDropList
      [id]="day.date"
      class="min-h-[120px] rounded-2xl border border-black/5 bg-white p-2 shadow-edge"
      [class.opacity-50]="!day.isCurrentMonth"
      [class.border-mint-300]="day.isToday"
      (cdkDropListDropped)="drop($event, day)"
    >
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold text-ink-500">{{ day.label }}</span>
        <span *ngIf="day.isToday" class="rounded-full bg-mint-100 px-2 py-0.5 text-[0.6rem] text-mint-700">
          Today
        </span>
      </div>
      <div class="mt-2 space-y-2">
        <div
          *ngFor="let event of eventsFor(day.date)"
          cdkDrag
          [cdkDragData]="event.id"
          class="rounded-xl border border-black/10 bg-ink-50 px-2 py-2 text-[0.7rem] font-medium text-ink-700"
        >
          <div class="flex items-start justify-between gap-2">
            <div>
              <div class="font-semibold text-ink-700">{{ event.title }}</div>
              <div class="text-[0.65rem] text-ink-400" *ngIf="event.time">{{ event.time }}</div>
            </div>
            <button class="text-[0.6rem] text-ink-400 hover:text-ink-700" (click)="remove(event.id)">
              Remove
            </button>
          </div>
        </div>
        <div *ngIf="eventsFor(day.date).length === 0" class="text-[0.65rem] text-ink-300">
          —
        </div>
      </div>
    </div>
  </div>
</section>
