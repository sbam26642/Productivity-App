<section class="space-y-4">
  <div class="flex items-center justify-between">
    <div>
      <p class="text-xs uppercase tracking-[0.24em] text-ink-500">To-do</p>
      <h2 class="font-display text-2xl">Daily list</h2>
    </div>
    <div class="flex items-center gap-2 rounded-full border border-ink-200 bg-white p-1 text-xs">
      <button
        class="rounded-full px-3 py-1"
        [class.bg-ink-900]="filter() === 'all'"
        [class.text-white]="filter() === 'all'"
        (click)="filter.set('all')"
      >
        All
      </button>
      <button
        class="rounded-full px-3 py-1"
        [class.bg-ink-900]="filter() === 'open'"
        [class.text-white]="filter() === 'open'"
        (click)="filter.set('open')"
      >
        Open
      </button>
      <button
        class="rounded-full px-3 py-1"
        [class.bg-ink-900]="filter() === 'done'"
        [class.text-white]="filter() === 'done'"
        (click)="filter.set('done')"
      >
        Done
      </button>
    </div>
  </div>

  <form class="glass flex flex-wrap items-center gap-3 rounded-2xl p-4" (ngSubmit)="addTodo()">
    <input
      class="flex-1 rounded-full border border-ink-200 bg-white px-3 py-2 text-sm focus:border-ink-400 focus:outline-none"
      placeholder="New task"
      [(ngModel)]="newTitle"
      name="title"
    />
    <input
      class="rounded-full border border-ink-200 bg-white px-3 py-2 text-sm focus:border-ink-400 focus:outline-none"
      type="date"
      [(ngModel)]="newDueDate"
      name="dueDate"
    />
    <button class="rounded-full bg-ink-900 px-4 py-2 text-xs font-semibold text-white" type="submit">
      Add
    </button>
  </form>

  <div class="space-y-3">
    <div
      *ngFor="let todo of todos()"
      class="flex items-center justify-between rounded-2xl border border-black/5 bg-white px-4 py-3 shadow-edge"
    >
      <label class="flex items-center gap-3">
        <input
          type="checkbox"
          class="h-4 w-4 rounded border-ink-300 text-ink-900"
          [checked]="todo.completed"
          (change)="toggle(todo.id)"
        />
        <span [class.line-through]="todo.completed" [class.text-ink-400]="todo.completed">
          {{ todo.title }}
        </span>
      </label>
      <div class="flex items-center gap-3 text-xs text-ink-500">
        <span *ngIf="todo.dueDate">{{ todo.dueDate }}</span>
        <button class="text-ink-400 hover:text-ink-600" (click)="remove(todo.id)">Remove</button>
      </div>
    </div>

    <div *ngIf="todos().length === 0" class="rounded-2xl border border-dashed border-ink-200 p-6 text-sm text-ink-500">
      Nothing here yet. Capture a task to get started.
    </div>
  </div>
</section>
